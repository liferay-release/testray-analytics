[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testray-analytics"
version = "0.1.0"
description = "Additive analytics module for Testray — regression triage (analysis); insights and custom-suite to follow."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "PyYAML>=6.0",
    "anthropic>=0.40.0",
    "jsonschema>=4.10.0",
]

# NOTE: no psycopg2 — the tool is REST-only (api source), no database (decision #4).
# Console script `testray-analysis` is wired in Stage 2 alongside cli.py.

[tool.setuptools.packages.find]
include = ["testray_analytics*"]
